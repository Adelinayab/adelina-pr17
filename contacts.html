<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vertex Architects — Контакты</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter&display=swap" rel="stylesheet">
</head>
<body>

    <header class="header">
        <div class="container navbar">
            <a href="index.html" class="navbar__logo">Vertex Architects</a>
            
            <nav>
                <ul class="navbar__menu">
                    <li><a href="index.html" class="navbar__link">Главная</a></li>
                    <li><a href="about.html" class="navbar__link">О бюро</a></li>
                    <li><a href="projects.html" class="navbar__link">Проекты</a></li>
                    <li><a href="services.html" class="navbar__link">Услуги</a></li>

                    <li><a href="blog.html" class="navbar__link">Блог</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="contacts">
            <div class="container">
                <h1>Контакты</h1>
                
                <div class="form">
                    <label for="name">Имя</label>
                    <input type="text" id="name" placeholder="Иван Петров">
                    
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="ivan@mail.ru">
                    
                    <label for="message">Сообщение</label>
                    <textarea id="message" placeholder="Ваше сообщение"></textarea>
                    
                    <button type="submit">Отправь сообщение</button>
                </div>
                
                <div class="requisites">
                    <h2>Реквизиты</h2>
                    <p class="requisites__item">Телефон: 123456789</p>
                    <p class="requisites__item">Адрес: 123456789</p>
                    <p class="requisites__item">Email: ivan@mail.ru</p>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Vertex Architects. Все права защищены.</p>
    </footer>
